name: BPVP Wallet Release

on:
  workflow_dispatch:
  push:
    tags:
      - "bpvp-wallet-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-wallet:
    name: Build wallet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: bpvp-wallet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: bpvp-wallet/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build core
        run: npm run build

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run package:win

      - name: Package Linux
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm run package:linux

      - name: Package macOS
        if: runner.os == 'macOS'
        run: npm run package:mac

      - name: Upload wallet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bpvp-wallet-${{ runner.os }}
          path: bpvp-wallet/release/**
          if-no-files-found: warn

      - name: Generate checksums
        run: |
          node -e "const fs=require('fs');const path=require('path');const crypto=require('crypto');const root=path.join(process.cwd(),'release');const out=path.join(root,'checksums-'+process.env.RUNNER_OS+'.txt');if(!fs.existsSync(root)){console.log('release directory missing; skipping checksums');process.exit(0);}const files=[];const walk=(d)=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(!e.name.endsWith('.blockmap'))files.push(p);}};walk(root);if(files.length===0){console.log('no release files found; skipping checksums');process.exit(0);}files.sort();const lines=files.map((f)=>{const h=crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');const rel='./'+path.relative(root,f).split(path.sep).join('/');return h+'  '+rel;});fs.writeFileSync(out,lines.join('\n')+'\n');console.log('wrote '+out+' with '+lines.length+' entries');"

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpvp-wallet-checksums-${{ runner.os }}
          path: bpvp-wallet/release/checksums-${{ runner.os }}.txt
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wallet]
    if: always() && github.ref_type == 'tag' && startsWith(github.ref_name, 'bpvp-wallet-v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # action-gh-release globs often miss paths with spaces ("BPVP Wallet ...").
      # Flatten installers into upload/ and publish with gh CLI (handles spaces).
      - name: Stage installers and merged checksums
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f \( \
            -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o \
            -name "*.zip" -o -name "*.tar.gz" \
          \) ! -name "*.blockmap" -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            cp "$f" "upload/$base"
          done
          : > upload/checksums.txt
          find release-assets -type f -name "checksums-*.txt" ! -name "checksums.txt" | sort | while IFS= read -r f; do
            cat "$f" >> upload/checksums.txt
          done
          echo "Staged for release:"
          ls -la upload

      # gh release upload syntax: tag then files then flags. Do not put --repo/--clobber
      # before file list (xargs used to do that and the CLI failed).
      - name: Create or update GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if ! gh --repo "$REPO" release view "$TAG" >/dev/null 2>&1; then
            gh --repo "$REPO" release create "$TAG" \
              --title "BPVP Wallet ${TAG}" \
              --notes "Signet/Testnet desktop wallet. Verify SHA256 using checksums.txt before install."
          fi
          shopt -s nullglob
          mapfile -t assets < <(find upload -maxdepth 1 -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No files in upload/ — failing so the release is not left empty."
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          gh --repo "$REPO" release upload "$TAG" "${assets[@]}" --clobber
