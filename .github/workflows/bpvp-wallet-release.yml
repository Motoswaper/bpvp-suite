name: BPVP Wallet Release

on:
  workflow_dispatch:
  push:
    tags:
      - "bpvp-wallet-v*"

permissions:
  contents: write

jobs:
  build-wallet:
    name: Build wallet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: bpvp-wallet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bpvp-wallet/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build core
        run: npm run build

      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run package:win

      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run package:linux

      - name: Package macOS
        if: runner.os == 'macOS'
        run: npm run package:mac

      - name: Upload wallet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bpvp-wallet-${{ runner.os }}
          path: bpvp-wallet/release/**
          if-no-files-found: error

      - name: Generate checksums (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd release
          find . -type f ! -name "*.blockmap" -print0 | sort -z | xargs -0 shasum -a 256 > "checksums-${{ runner.os }}.txt"

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location release
          Get-ChildItem -Recurse -File | Where-Object { $_.Name -notlike "*.blockmap" } | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  ./$($_.FullName.Replace('\','/'))"
          } | Out-File -Encoding ascii "checksums-${{ runner.os }}.txt"

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpvp-wallet-checksums-${{ runner.os }}
          path: bpvp-wallet/release/checksums-${{ runner.os }}.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wallet]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'bpvp-wallet-v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # action-gh-release globs often miss paths with spaces ("BPVP Wallet ...").
      # Flatten installers into upload/ and publish with gh CLI (handles spaces).
      - name: Stage installers and merged checksums
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f \( \
            -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o \
            -name "*.zip" -o -name "*.tar.gz" \
          \) ! -name "*.blockmap" -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            cp "$f" "upload/$base"
          done
          : > upload/checksums.txt
          find release-assets -type f -name "checksums-*.txt" ! -name "checksums.txt" | sort | while IFS= read -r f; do
            cat "$f" >> upload/checksums.txt
          done
          echo "Staged for release:"
          ls -la upload

      - name: Create or update GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "BPVP Wallet ${TAG}" \
              --notes "Desktop wallet for **Signet / Testnet** only. Verify SHA256 using \`checksums.txt\` before opening installers."
          fi
          if [ "$(find upload -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            echo "No files in upload/ — failing so the release is not left empty."
            exit 1
          fi
          find upload -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber
