name: BPVP Wallet Release

on:
  workflow_dispatch:
  push:
    tags:
      - "bpvp-wallet-v*"

permissions:
  contents: write

jobs:
  build-wallet:
    name: Build wallet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: bpvp-wallet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bpvp-wallet/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build core
        run: npm run build

      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run package:win

      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run package:linux

      - name: Package macOS
        if: runner.os == 'macOS'
        run: npm run package:mac

      - name: Upload wallet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bpvp-wallet-${{ runner.os }}
          path: bpvp-wallet/release/**
          if-no-files-found: error

      - name: Generate checksums (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd release
          find . -type f ! -name "*.blockmap" -print0 | sort -z | xargs -0 shasum -a 256 > "checksums-${{ runner.os }}.txt"

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location release
          Get-ChildItem -Recurse -File | Where-Object { $_.Name -notlike "*.blockmap" } | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  ./$($_.FullName.Replace('\','/'))"
          } | Out-File -Encoding ascii "checksums-${{ runner.os }}.txt"

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpvp-wallet-checksums-${{ runner.os }}
          path: bpvp-wallet/release/checksums-${{ runner.os }}.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wallet]
    if: startsWith(github.ref, 'refs/tags/bpvp-wallet-v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Build merged checksums
        run: |
          mkdir -p release-assets/checksums
          find release-assets -type f -name "checksums-*.txt" -exec cp {} release-assets/checksums/ \;
          cat release-assets/checksums/checksums-*.txt > release-assets/checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
