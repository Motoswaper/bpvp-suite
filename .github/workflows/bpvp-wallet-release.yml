name: BPVP Wallet Release

on:
  workflow_dispatch:
  push:
    tags:
      - "bpvp-wallet-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  id-token: write

jobs:
  build-wallet:
    name: Build wallet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: bpvp-wallet
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Electron/electron-builder packaging is currently more stable on Node 22 in CI.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bpvp-wallet/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build core
        run: npm run build

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
          sudo apt-get install -y fakeroot dpkg

      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run package:win

      - name: Package Linux
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm run package:linux

      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac

      - name: Debug release directory
        if: always()
        run: |
          echo "Release directory tree (if any):"
          ls -la release || true
          find release -maxdepth 3 -type f | sort || true

      - name: Upload wallet artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bpvp-wallet-${{ runner.os }}
          path: bpvp-wallet/release/**
          if-no-files-found: warn

      - name: Generate checksums
        if: always()
        run: |
          node -e "const fs=require('fs');const path=require('path');const crypto=require('crypto');const root=path.join(process.cwd(),'release');const out=path.join(root,'checksums-'+process.env.RUNNER_OS+'.txt');if(!fs.existsSync(root)){console.log('release directory missing; skipping checksums');process.exit(0);}const files=[];const walk=(d)=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(!e.name.endsWith('.blockmap'))files.push(p);}};walk(root);if(files.length===0){console.log('no release files found; skipping checksums');process.exit(0);}files.sort();const lines=files.map((f)=>{const h=crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');const rel='./'+path.relative(root,f).split(path.sep).join('/');return h+'  '+rel;});fs.writeFileSync(out,lines.join('\n')+'\n');console.log('wrote '+out+' with '+lines.length+' entries');"

      - name: Upload checksums artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bpvp-wallet-checksums-${{ runner.os }}
          path: bpvp-wallet/release/checksums-${{ runner.os }}.txt
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wallet]
    if: always() && startsWith(github.ref, 'refs/tags/bpvp-wallet-v')
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      # action-gh-release globs often miss paths with spaces ("BPVP Wallet ...").
      # Flatten installers into upload/ and publish with gh CLI (handles spaces).
      - name: Stage installers and merged checksums
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f \( \
            -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o \
            -name "*.zip" -o -name "*.tar.gz" \
          \) ! -name "*.blockmap" -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            cp "$f" "upload/$base"
          done
          : > upload/checksums.txt
          found_checksums=0
          while IFS= read -r f; do
            found_checksums=1
            cat "$f" >> upload/checksums.txt
          done < <(find release-assets -type f -name "checksums-*.txt" ! -name "checksums.txt" | sort)
          if [ "${found_checksums}" -eq 0 ]; then
            echo "No per-OS checksum artifacts found; generating checksums.txt from upload/"
            node -e "const fs=require('fs');const path=require('path');const crypto=require('crypto');const root=path.resolve('upload');const files=fs.readdirSync(root).filter((f)=>fs.statSync(path.join(root,f)).isFile()&&f!=='checksums.txt').sort();const lines=files.map((f)=>{const h=crypto.createHash('sha256').update(fs.readFileSync(path.join(root,f))).digest('hex');return h+'  ./'+f;});fs.writeFileSync(path.join(root,'checksums.txt'),lines.join('\n')+'\n');"
          fi
          cosign sign-blob \
            --yes \
            --output-signature upload/checksums.txt.sig \
            --output-certificate upload/checksums.txt.pem \
            upload/checksums.txt
          cosign verify-blob \
            --certificate upload/checksums.txt.pem \
            --signature upload/checksums.txt.sig \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/bpvp-wallet-release.yml@.*" \
            upload/checksums.txt
          # Hard gate: do not publish incomplete releases.
          ls upload/*.exe >/dev/null 2>&1 || { echo "Missing Windows .exe asset"; exit 1; }
          ls upload/*.dmg >/dev/null 2>&1 || { echo "Missing macOS .dmg asset"; exit 1; }
          ls upload/*.AppImage >/dev/null 2>&1 || { echo "Missing Linux .AppImage asset"; exit 1; }
          ls upload/*.deb >/dev/null 2>&1 || { echo "Missing Linux .deb asset"; exit 1; }
          [ -s upload/checksums.txt ] || { echo "Missing checksums.txt"; exit 1; }
          [ -s upload/checksums.txt.sig ] || { echo "Missing checksums.txt.sig"; exit 1; }
          [ -s upload/checksums.txt.pem ] || { echo "Missing checksums.txt.pem"; exit 1; }
          echo "Staged for release:"
          ls -la upload

      # gh release upload syntax: tag then files then flags. Do not put --repo/--clobber
      # before file list (xargs used to do that and the CLI failed).
      - name: Create or update GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if ! gh --repo "$REPO" release view "$TAG" >/dev/null 2>&1; then
            gh --repo "$REPO" release create "$TAG" \
              --title "BPVP Wallet ${TAG}" \
              --notes "Signet/Testnet desktop wallet. Verify SHA256 using checksums.txt before install."
          fi
          shopt -s nullglob
          mapfile -t assets < <(find upload -maxdepth 1 -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No files in upload/ — failing so the release is not left empty."
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          gh --repo "$REPO" release upload "$TAG" "${assets[@]}" --clobber
