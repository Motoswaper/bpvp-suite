name: INFO - ZAP Baseline DAST

on:
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: INFO - Scan public surface with ZAP
    runs-on: ubuntu-latest
    steps:
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://testnet.btc-defi.com"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a"

