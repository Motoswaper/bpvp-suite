name: Roles Access Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional override (defaults to local runner app)"
        required: true
        default: "http://127.0.0.1:3100"
  schedule:
    - cron: "20 5 * * 1"

# Opt into Node 24 for JS actions (see GitHub Actions runner changelog).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  roles-smoke:
    name: Validate role access controls
    runs-on: ubuntu-latest
    # Next may inline process.env at `npm run build`; must be set here so the bypass survives the bundle.
    env:
      BPVP_ROLES_SMOKE_SKIP_ENGINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --include=dev

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Start dashboard locally
        env:
          PORT: "3100"
          NODE_ENV: "production"
          BPVP_SESSION_COOKIE_SECURE: "false"
          BPVP_ALLOW_PUBLIC_REGISTER: "true"
          # One absolute path for all Next workers (avoid cwd drift vs ../.run)
          BPVP_AUTH_USER_STORE: ${{ github.workspace }}/.run/auth-users.json
          DASHBOARD_PASSWORD: ${{ secrets.BPVP_ADMIN_PASSWORD }}
        run: |
          mkdir -p .run
          nohup npm --prefix dashboard run start > .run/roles-smoke-dashboard.log 2>&1 &
          for i in $(seq 1 60); do
            set +e
            curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3100 >/dev/null 2>&1
            curl_ec=$?
            set -e
            if [[ "${curl_ec}" -eq 0 ]]; then
              echo "Dashboard is up (warming up a few seconds)"
              sleep 5
              exit 0
            fi
            sleep 1
          done
          echo "Dashboard failed to start"
          cat .run/roles-smoke-dashboard.log || true
          exit 1

      - name: Ensure script is executable
        run: chmod +x ./scripts/roles-access-smoke.sh

      - name: Validate required secret
        env:
          ADMIN_PASSWORD: ${{ secrets.BPVP_ADMIN_PASSWORD }}
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "ERROR: BPVP_ADMIN_PASSWORD secret is empty or unavailable in this workflow context."
            exit 1
          fi

      - name: Run roles smoke
        env:
          BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:3100' }}
          ADMIN_PASSWORD: ${{ secrets.BPVP_ADMIN_PASSWORD }}
        run: ./scripts/roles-access-smoke.sh

      - name: Stage smoke artifacts for upload
        if: always()
        run: |
          mkdir -p artifact-staging-roles-smoke
          shopt -s nullglob
          for f in .run/roles-smoke-*.txt; do
            cp "$f" artifact-staging-roles-smoke/
          done
          if [[ -f .run/roles-smoke-dashboard.log ]]; then
            cp .run/roles-smoke-dashboard.log artifact-staging-roles-smoke/dashboard-startup.log
          fi
          ls -la artifact-staging-roles-smoke || true

      - name: Upload roles smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roles-smoke-artifacts
          path: artifact-staging-roles-smoke/
          if-no-files-found: warn
