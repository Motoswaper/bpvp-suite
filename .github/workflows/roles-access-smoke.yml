name: Roles Access Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional override (defaults to local runner app)"
        required: true
        default: "http://127.0.0.1:3100"
  schedule:
    - cron: "20 5 * * 1"

permissions:
  contents: read

jobs:
  roles-smoke:
    name: Validate role access controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --include=dev

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      # Dashboard proxies engine actions to ENGINE_URL; without a listener the smoke test can see upstream 401/502.
      - name: Start stub AXE engine for smoke
        run: |
          mkdir -p .run
          cat > .run/stub-axe-engine.cjs <<'EOF'
          const http = require("http");
          http
            .createServer((req, res) => {
              const path = req.url.split("?")[0];
              if (req.method === "POST" && path === "/actions") {
                req.on("data", () => {});
                req.on("end", () => {
                  res.writeHead(200, { "Content-Type": "application/json" });
                  res.end(JSON.stringify({ ok: true, stubEngine: true }));
                });
                return;
              }
              res.writeHead(404);
              res.end();
            })
            .listen(28080, "127.0.0.1", () => {
              process.stdout.write("stub engine listening on 28080\n");
            });
          EOF
          nohup node .run/stub-axe-engine.cjs > .run/stub-axe-engine.log 2>&1 &
          for i in $(seq 1 25); do
            code="000"
            curl_ec=1
            set +e
            code="$(curl -sS --connect-timeout 2 --max-time 5 -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:28080/actions \
              -H "Content-Type: application/json" -d "{}")"
            curl_ec=$?
            set -e
            if [[ "${curl_ec}" -eq 0 && "${code}" == "200" ]]; then
              echo "Stub AXE engine is up"
              exit 0
            fi
            sleep 1
          done
          echo "Stub engine failed to start"
          cat .run/stub-axe-engine.log || true
          exit 1

      - name: Start dashboard locally
        env:
          PORT: "3100"
          NODE_ENV: "production"
          BPVP_SESSION_COOKIE_SECURE: "false"
          BPVP_ALLOW_PUBLIC_REGISTER: "true"
          DASHBOARD_PASSWORD: ${{ secrets.BPVP_ADMIN_PASSWORD }}
          ENGINE_URL: "http://127.0.0.1:28080"
          AXE_API_KEY: "roles-smoke-ci-key"
          AXE_HMAC_SECRET: "roles-smoke-ci-hmac-not-for-production"
        run: |
          mkdir -p .run
          nohup npm --prefix dashboard run start > .run/roles-smoke-dashboard.log 2>&1 &
          for i in $(seq 1 60); do
            set +e
            curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3100 >/dev/null 2>&1
            curl_ec=$?
            set -e
            if [[ "${curl_ec}" -eq 0 ]]; then
              echo "Dashboard is up (warming up a few seconds)"
              sleep 5
              exit 0
            fi
            sleep 1
          done
          echo "Dashboard failed to start"
          cat .run/roles-smoke-dashboard.log || true
          exit 1

      - name: Ensure script is executable
        run: chmod +x ./scripts/roles-access-smoke.sh

      - name: Validate required secret
        env:
          ADMIN_PASSWORD: ${{ secrets.BPVP_ADMIN_PASSWORD }}
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "ERROR: BPVP_ADMIN_PASSWORD secret is empty or unavailable in this workflow context."
            exit 1
          fi

      - name: Run roles smoke
        env:
          BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:3100' }}
          ADMIN_PASSWORD: ${{ secrets.BPVP_ADMIN_PASSWORD }}
        run: ./scripts/roles-access-smoke.sh

      - name: Stage smoke artifacts for upload
        if: always()
        run: |
          mkdir -p artifact-staging-roles-smoke
          shopt -s nullglob
          for f in .run/roles-smoke-*.txt; do
            cp "$f" artifact-staging-roles-smoke/
          done
          if [[ -f .run/roles-smoke-dashboard.log ]]; then
            cp .run/roles-smoke-dashboard.log artifact-staging-roles-smoke/dashboard-startup.log
          fi
          if [[ -f .run/stub-axe-engine.log ]]; then
            cp .run/stub-axe-engine.log artifact-staging-roles-smoke/stub-axe-engine.log
          fi
          ls -la artifact-staging-roles-smoke || true

      - name: Upload roles smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roles-smoke-artifacts
          path: artifact-staging-roles-smoke/
          if-no-files-found: warn

