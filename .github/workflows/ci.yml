name: REQUIRED - AXE CI

on:
  push:
    branches: [main, master]
  pull_request:

# Opt into Node 24 for JS actions before the June 2026 runner default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  backend-quality:
    name: REQUIRED - Backend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Static checks
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Build all binaries
        run: go build ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # govulncheck often flags stdlib/toolchain issues; keep vet+tests strict.
      - name: Dependency vulnerability scan
        continue-on-error: true
        run: govulncheck ./...

  dashboard-quality:
    name: REQUIRED - Dashboard Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install deps
        run: npm install --include=dev

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # High audit often fails on transitive deps; keep typecheck+build strict.
      - name: npm audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high

  container-security:
    name: INFO - Container Security Scan
    runs-on: ubuntu-latest
    needs: [backend-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build -t axe-backend-ci:latest ./backend

      # Do not fail the workflow on findings; SARIF still uploads for review.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: axe-backend-ci:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      # Upload can fail on forks or when Code Scanning is not enabled for the repo.
      - name: Upload SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  security-immutability:
    name: REQUIRED - Security and Immutability Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure scripts are executable
        run: chmod +x ./scripts/*.sh

      - name: Run security gates
        run: ./scripts/security-gates.sh

  release-readiness:
    name: INFO - Release Readiness (Final Audit)
    runs-on: ubuntu-latest
    needs: [backend-quality, dashboard-quality, container-security, security-immutability]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm install --include=dev

      - name: Ensure scripts are executable
        run: chmod +x ./scripts/*.sh

      # Full stack + smoke in CI is slow/flaky; do not block merges on it.
      # Secrets are bootstrapped in final-audit when GITHUB_ACTIONS=true.
      - name: Run final audit gate
        continue-on-error: true
        env:
          AXE_BUILD_ON_START: "true"
          AXE_HEALTH_TIMEOUT_SECONDS: "180"
        run: ./scripts/final-audit.sh

      - name: Upload final audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: final-audit-report
          path: .run/final-audit-report.txt
          if-no-files-found: warn

      - name: Teardown suite
        if: always()
        continue-on-error: true
        run: ./scripts/stop-suite.sh
