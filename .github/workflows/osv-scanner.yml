name: INFO - OSV Dependency Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "15 4 * * 2"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    name: INFO - Scan dependencies with OSV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run OSV scanner
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            ghcr.io/google/osv-scanner/osv-scanner:v2 \
            scan --recursive /src --format sarif --output /src/osv-results.sarif

      - name: Upload OSV SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv-results.sarif
